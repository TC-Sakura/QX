# 百度APP 去开屏广告
# 使用前请开启 MitM，并信任证书
# 建议清除百度APP缓存或卸载重装后再测试

hostname = afd.baidu.com, afdconf.baidu.com, mobads.baidu.com, cpro.baidu.com, eclick.baidu.com, ecmb.bdimg.com, *.bdstatic.com, update.baidu.com, nsclick.baidu.com

# 开屏广告相关接口
^https?:\/\/afd\.baidu\.com\/ url reject-200
^https?:\/\/afdconf\.baidu\.com\/ url reject-200
^https?:\/\/mobads\.baidu\.com\/ url reject-200
^https?:\/\/cpro\.baidu\.com\/ url reject-200
^https?:\/\/eclick\.baidu\.com\/ url reject-200
^https?:\/\/nsclick\.baidu\.com\/ url reject-200
^https?:\/\/ecmb\.bdimg\.com\/ url reject-200

# 开屏图片/资源
^https?:\/\/.*\.bdstatic\.com\/.*\/(splash|ad|advert|kaiping|start).*?\.(jpg|png|gif|webp|mp4) url reject-200
^https?:\/\/dss0\.bdstatic\.com\/.*\/tam-ogel\/.*\.jpg url reject-200

# 更新/广告配置
^https?:\/\/update\.baidu\.com\/.*ad url reject-200
